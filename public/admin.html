<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - VANCARE Advan</title>
  <!-- Google Fonts: Orbitron & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- SweetAlert2 for confirmation & alerts -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            advan: ['Orbitron', 'sans-serif']
          },
          colors: {
            brand: {
              dark: '#090a0f',
              card: '#12141e',
              surface: '#181b28',
              border: '#232738',
              pink: '#e6007e',
              'pink-hover': '#cc006f',
              'pink-light': '#fdf2f8'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col text-sm">

  <!-- NAVBAR ADMIN (MENGGUNAKAN LOGO ADVAN ASLI) -->
  <header class="bg-brand-dark text-white border-b border-slate-800 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      
      <!-- Brand & Logo Advan Asli -->
      <div class="flex items-center space-x-3">
        <a href="/admin" class="flex items-center">
          <img src="/images/advan-header.png" alt="Advan Made to Inspire" class="h-9 sm:h-10 w-auto object-contain">
        </a>
        <div class="h-5 w-px bg-zinc-700"></div>
        <div class="flex items-center gap-1.5">
          <span class="font-advan font-black text-white tracking-[0.16em] text-base">VAN<span class="text-brand-pink">CARE</span></span>
          <span class="text-[10px] bg-brand-pink/20 text-brand-pink border border-brand-pink/30 px-2 py-0.5 rounded-full font-bold uppercase tracking-wider">
            Admin
          </span>
        </div>
      </div>

      <!-- Action Kanan -->
      <div class="flex items-center space-x-3">
        <a href="/" target="_blank" class="text-xs text-slate-300 hover:text-white px-3 py-1.5 rounded-md hover:bg-slate-800 transition flex items-center gap-1.5">
          <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
          <span>Form Pelanggan</span>
        </a>
        <button id="refreshBtn" onclick="loadClaimsData()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 hover:text-white px-3 py-1.5 rounded-md transition flex items-center gap-1.5 border border-slate-700">
          <i class="fa-solid fa-rotate text-[11px]" id="refreshIcon"></i>
          <span>Refresh</span>
        </button>
      </div>

    </div>
  </header>

  <!-- KONTEN UTAMA -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 w-full flex-1 space-y-5">
    
    <!-- STATISTIK RINGKAS (MINIMALIS) -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
      <div class="bg-white p-4 rounded-xl border border-slate-200">
        <div class="text-xs text-slate-500 font-medium">Total Klaim</div>
        <div id="statTotal" class="text-2xl font-bold text-slate-900 mt-1">0</div>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200">
        <div class="text-xs text-amber-600 font-medium flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-amber-500"></span>
          Menunggu Review
        </div>
        <div id="statPending" class="text-2xl font-bold text-amber-600 mt-1">0</div>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200">
        <div class="text-xs text-emerald-600 font-medium">Disetujui</div>
        <div id="statApproved" class="text-2xl font-bold text-emerald-600 mt-1">0</div>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200">
        <div class="text-xs text-slate-500 font-medium">Ditolak</div>
        <div id="statRejected" class="text-2xl font-bold text-slate-600 mt-1">0</div>
      </div>
    </div>

    <!-- PENCARIAN & FILTER TAB (SIMPEL) -->
    <div class="bg-white p-3 rounded-xl border border-slate-200 flex flex-col sm:flex-row gap-3 justify-between items-center">
      
      <!-- Tab Status Filter -->
      <div class="flex items-center space-x-1 bg-slate-100 p-1 rounded-lg w-full sm:w-auto text-xs">
        <button onclick="setFilterStatus('ALL')" id="btnFilterAll" class="filter-tab active px-3 py-1.5 rounded-md font-semibold bg-white text-slate-800 shadow-sm transition">
          Semua
        </button>
        <button onclick="setFilterStatus('PENDING')" id="btnFilterPending" class="filter-tab px-3 py-1.5 rounded-md font-medium text-slate-600 hover:text-slate-900 transition">
          Pending
        </button>
        <button onclick="setFilterStatus('APPROVED')" id="btnFilterApproved" class="filter-tab px-3 py-1.5 rounded-md font-medium text-slate-600 hover:text-slate-900 transition">
          Disetujui
        </button>
        <button onclick="setFilterStatus('REJECTED')" id="btnFilterRejected" class="filter-tab px-3 py-1.5 rounded-md font-medium text-slate-600 hover:text-slate-900 transition">
          Ditolak
        </button>
      </div>

      <!-- Kotak Pencarian -->
      <div class="relative w-full sm:w-72">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-xs"></i>
        <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Cari tiket, nama, SN..."
          class="w-full pl-8 pr-3 py-1.5 rounded-lg border border-slate-200 text-xs focus:ring-1 focus:ring-brand-pink focus:border-brand-pink outline-none">
      </div>

    </div>

    <!-- TABEL KLAIM -->
    <div class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
      
      <div class="px-5 py-3 border-b border-slate-200 flex items-center justify-between bg-slate-50/50">
        <div class="font-semibold text-xs text-slate-700 uppercase tracking-wide">
          Daftar Pengajuan Garansi
        </div>
        <div id="tableCount" class="text-xs text-slate-500 font-medium">
          0 Data
        </div>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-xs">
          <thead>
            <tr class="bg-slate-50 text-slate-500 uppercase text-[11px] font-semibold border-b border-slate-200">
              <th class="py-3 px-4">No. Tiket</th>
              <th class="py-3 px-4">Pelanggan</th>
              <th class="py-3 px-4">Produk & SN</th>
              <th class="py-3 px-4">Kendala</th>
              <th class="py-3 px-4 text-center">Bukti Media</th>
              <th class="py-3 px-4 text-center">Status</th>
              <th class="py-3 px-4 text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="claimsTableBody" class="divide-y divide-slate-100">
            <!-- Loading -->
            <tr>
              <td colspan="7" class="py-10 text-center text-slate-400">
                <i class="fa-solid fa-spinner fa-spin text-lg mb-1 text-slate-400"></i>
                <p>Memuat data klaim...</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>

  </main>

  <!-- MODAL RINCIAN KLAIM (BERSIH) -->
  <div id="detailModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-xl max-w-xl w-full shadow-lg border border-slate-200 overflow-hidden text-xs">
      
      <!-- Header Modal -->
      <div class="px-5 py-3.5 border-b border-slate-200 flex items-center justify-between bg-slate-50">
        <h3 class="font-bold text-slate-800 text-sm">Detail Klaim Garansi</h3>
        <button onclick="closeDetailModal()" class="text-slate-400 hover:text-slate-600">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>

      <!-- Body Modal -->
      <div id="modalBody" class="p-5 space-y-4 max-h-[75vh] overflow-y-auto">
        <!-- Render via JS -->
      </div>

      <!-- Footer Modal -->
      <div class="px-5 py-3 border-t border-slate-200 bg-slate-50 flex justify-end">
        <button onclick="closeDetailModal()" class="px-3.5 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold rounded-lg transition">
          Tutup
        </button>
      </div>

    </div>
  </div>

  <!-- JAVASCRIPT LOGIC ADMIN -->
  <script>
    let allClaims = [];
    let currentFilter = 'ALL';
    let searchQuery = '';

    document.addEventListener('DOMContentLoaded', () => {
      loadClaimsData();
    });

    async function loadClaimsData() {
      const refreshIcon = document.getElementById('refreshIcon');
      refreshIcon.classList.add('fa-spin');

      try {
        const resClaims = await fetch('/api/claims');
        const dataClaims = await resClaims.json();

        const resStats = await fetch('/api/stats');
        const dataStats = await resStats.json();

        if (dataClaims.success) {
          allClaims = dataClaims.data;
          renderStats(dataStats.stats || {});
          renderTable();
        }
      } catch (err) {
        console.error('Error load claims:', err);
      } finally {
        setTimeout(() => refreshIcon.classList.remove('fa-spin'), 300);
      }
    }

    function renderStats(stats) {
      document.getElementById('statTotal').textContent = stats.total || 0;
      document.getElementById('statPending').textContent = stats.pending || 0;
      document.getElementById('statApproved').textContent = stats.approved || 0;
      document.getElementById('statRejected').textContent = stats.rejected || 0;
    }

    function setFilterStatus(status) {
      currentFilter = status;
      document.querySelectorAll('.filter-tab').forEach(tab => {
        tab.classList.remove('bg-white', 'text-slate-800', 'shadow-sm', 'font-semibold');
        tab.classList.add('text-slate-600', 'font-medium');
      });

      const activeBtn = document.getElementById(`btnFilter${status.charAt(0).toUpperCase() + status.slice(1).toLowerCase()}`);
      if (activeBtn) {
        activeBtn.classList.add('bg-white', 'text-slate-800', 'shadow-sm', 'font-semibold');
        activeBtn.classList.remove('text-slate-600', 'font-medium');
      }

      renderTable();
    }

    function handleSearch() {
      searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById('claimsTableBody');
      const tableCount = document.getElementById('tableCount');

      let filtered = allClaims;

      if (currentFilter !== 'ALL') {
        filtered = filtered.filter(c => c.status === currentFilter);
      }

      if (searchQuery) {
        filtered = filtered.filter(c => 
          (c.ticket_number && c.ticket_number.toLowerCase().includes(searchQuery)) ||
          (c.customer_name && c.customer_name.toLowerCase().includes(searchQuery)) ||
          (c.customer_email && c.customer_email.toLowerCase().includes(searchQuery)) ||
          (c.product_name && c.product_name.toLowerCase().includes(searchQuery)) ||
          (c.serial_number && c.serial_number.toLowerCase().includes(searchQuery))
        );
      }

      tableCount.textContent = `${filtered.length} Data`;

      if (filtered.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7" class="py-8 text-center text-slate-400">
              Tidak ada data klaim yang sesuai.
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = filtered.map(c => {
        const isApproved = c.status === 'APPROVED';
        const isPending = c.status === 'PENDING';

        // Badge Status Simpel
        let statusBadge = '';
        if (isPending) {
          statusBadge = `<span class="inline-block px-2 py-0.5 rounded text-[11px] font-semibold bg-amber-50 text-amber-700 border border-amber-200">Pending</span>`;
        } else if (isApproved) {
          statusBadge = `<span class="inline-block px-2 py-0.5 rounded text-[11px] font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">Disetujui</span>`;
        } else {
          statusBadge = `<span class="inline-block px-2 py-0.5 rounded text-[11px] font-semibold bg-slate-100 text-slate-600">Ditolak</span>`;
        }

        // Bukti Media Simpel (Foto & Video terpisah)
        let mediaBtns = [];
        if (c.photo_url || c.drive_file_url) {
          const pUrl = c.photo_url || c.drive_file_url;
          mediaBtns.push(`
            <a href="${pUrl}" target="_blank"
              class="inline-flex items-center gap-1 text-slate-700 hover:text-brand-pink bg-slate-100 hover:bg-slate-200 px-2 py-0.5 rounded text-[11px] transition" title="Lihat Foto / Nota">
              <i class="fa-regular fa-image text-brand-pink"></i>
              <span>Foto</span>
            </a>
          `);
        }
        if (c.video_url) {
          mediaBtns.push(`
            <a href="${c.video_url}" target="_blank"
              class="inline-flex items-center gap-1 text-slate-700 hover:text-purple-600 bg-slate-100 hover:bg-slate-200 px-2 py-0.5 rounded text-[11px] transition" title="Lihat Rekaman Video">
              <i class="fa-solid fa-film text-purple-600"></i>
              <span>Video</span>
            </a>
          `);
        }
        const mediaBtn = mediaBtns.length > 0 
          ? `<div class="flex items-center justify-center gap-1">${mediaBtns.join('')}</div>`
          : '<span class="text-slate-400 text-[11px]">-</span>';

        const dateStr = c.created_at ? new Date(c.created_at).toLocaleDateString('id-ID', {
          day: '2-digit', month: 'short', year: 'numeric'
        }) : '-';

        return `
          <tr onclick="handleRowClick(event, '${c.id}')"
            class="hover:bg-pink-50/20 cursor-pointer transition border-b border-slate-100 group"
            title="Klik baris untuk melihat detail rincian klaim #${c.ticket_number}">
            <!-- No Tiket -->
            <td class="py-3 px-4">
              <div class="flex items-center gap-1 font-semibold text-slate-900 group-hover:text-brand-pink transition-colors">
                <span>${c.ticket_number}</span>
                <button onclick="event.stopPropagation(); copyToClipboard('${c.ticket_number}')" title="Salin" class="text-slate-400 hover:text-slate-600 p-0.5">
                  <i class="fa-regular fa-copy text-[11px]"></i>
                </button>
              </div>
              <div class="text-[10px] text-slate-400">${dateStr}</div>
            </td>

            <!-- Pelanggan -->
            <td class="py-3 px-4">
              <div class="font-medium text-slate-800">${escapeHtml(c.customer_name)}</div>
              <div class="text-[11px] text-slate-500">${escapeHtml(c.customer_phone)}</div>
            </td>

            <!-- Perangkat -->
            <td class="py-3 px-4">
              <div class="font-medium text-slate-800">
                ${c.product_category ? `<span class="text-[10px] text-brand-pink font-bold uppercase tracking-wider block">${escapeHtml(c.product_category)}</span>` : ''}
                ${escapeHtml(c.product_name)}
              </div>
              <div class="text-[10px] font-mono text-slate-500">${escapeHtml(c.serial_number)}</div>
            </td>

            <!-- Kendala -->
            <td class="py-3 px-4 max-w-xs">
              <p class="truncate text-slate-600" title="${escapeHtml(c.issue_description)}">
                ${escapeHtml(c.issue_description)}
              </p>
              <span class="text-[10px] text-brand-pink font-semibold group-hover:underline">Klik untuk baca selengkapnya &rarr;</span>
            </td>

            <!-- Media -->
            <td class="py-3 px-4 text-center">
              ${mediaBtn}
            </td>

            <!-- Status -->
            <td class="py-3 px-4 text-center">
              ${statusBadge}
            </td>

            <!-- Aksi (Tombol Approve & Tolak) -->
            <td class="py-3 px-4 text-center">
              <div class="flex items-center justify-center gap-1.5">
                ${isPending ? `
                  <button onclick="event.stopPropagation(); oneClickApprove('${c.id}', '${c.ticket_number}', '${escapeHtml(c.customer_name)}')"
                    id="approveBtn_${c.id}"
                    class="bg-brand-pink hover:bg-brand-pink-hover text-white font-semibold px-2.5 py-1 rounded text-[11px] transition inline-flex items-center gap-1 shadow-xs">
                    <i class="fa-solid fa-check text-[10px]"></i>
                    <span>Approve</span>
                  </button>

                  <button onclick="event.stopPropagation(); rejectClaimModal('${c.id}', '${c.ticket_number}', '${escapeHtml(c.customer_name)}')"
                    id="rejectBtn_${c.id}"
                    class="bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 font-semibold px-2.5 py-1 rounded text-[11px] transition inline-flex items-center gap-1"
                    title="Tolak Pengajuan Klaim">
                    <i class="fa-solid fa-xmark text-[10px]"></i>
                    <span>Tolak</span>
                  </button>
                ` : isApproved ? `
                  <span class="text-emerald-600 text-[11px] font-medium inline-flex items-center gap-1">
                    <i class="fa-solid fa-check text-[10px]"></i> Disetujui
                  </span>
                ` : `
                  <span class="text-rose-500 text-[11px] font-medium inline-flex items-center gap-1" title="${escapeHtml(c.rejected_reason || 'Ditolak')}">
                    <i class="fa-solid fa-circle-xmark text-[10px]"></i> Ditolak
                  </span>
                `}

                <button onclick="event.stopPropagation(); showDetail('${c.id}')" class="text-slate-500 hover:text-slate-800 px-2 py-1 rounded hover:bg-slate-100 transition text-[11px]">
                  Detail
                </button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    /**
     * FITUR: TOLAK PENGAJUAN KLAIM GARANSI
     */
    async function rejectClaimModal(claimId, ticketNo, customerName) {
      const { value: reason } = await Swal.fire({
        title: 'Tolak Pengajuan Klaim?',
        html: `Anda akan menolak klaim untuk tiket <strong class="text-brand-pink">${ticketNo}</strong> (${escapeHtml(customerName)}).<br><span class="text-xs text-slate-500">Pelanggan akan menerima email pemberitahuan resmi beserta alasan penolakan.</span>`,
        input: 'textarea',
        inputLabel: 'Alasan Penolakan Klaim (Wajib):',
        inputPlaceholder: 'Contoh: Masa garansi unit telah berakhir, segel garansi rusak, atau kerusakan akibat kelalaian pemakaian (cairan/jatuh)...',
        inputAttributes: {
          'aria-label': 'Tuliskan alasan penolakan di sini'
        },
        inputValidator: (value) => {
          if (!value || !value.trim()) {
            return 'Harap masukkan alasan penolakan klaim!';
          }
        },
        showCancelButton: true,
        confirmButtonColor: '#e11d48',
        cancelButtonColor: '#64748b',
        confirmButtonText: 'Tolak Klaim & Kirim Email',
        cancelButtonText: 'Batal'
      });

      if (!reason) return;

      const btn = document.getElementById(`rejectBtn_${claimId}`);
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-[10px]"></i>`;
      }

      try {
        const response = await fetch(`/api/claims/${claimId}/reject`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ reason: reason.trim() })
        });

        const result = await response.json();

        if (response.ok && result.success) {
          Swal.fire({
            icon: 'success',
            title: 'Klaim Berhasil Ditolak',
            text: `Tiket ${ticketNo} telah ditolak. Email pemberitahuan resmi telah dikirim ke pelanggan.`,
            confirmButtonColor: '#e11d48'
          });
          await loadClaimsData();
        } else {
          Swal.fire({
            icon: 'error',
            title: 'Gagal Menolak Klaim',
            text: result.message || 'Terjadi kesalahan sistem'
          });
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = `<i class="fa-solid fa-xmark text-[10px]"></i> Tolak`;
          }
        }
      } catch (err) {
        Swal.fire({ icon: 'error', title: 'Kesalahan Jaringan', text: err.message });
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = `<i class="fa-solid fa-xmark text-[10px]"></i> Tolak`;
        }
      }
    }
    async function oneClickApprove(claimId, ticketNo, customerName) {
      const confirmResult = await Swal.fire({
        title: 'Approve Klaim?',
        text: `Setujui tiket ${ticketNo} (${customerName}) dan kirim email konfirmasi ke pelanggan?`,
        icon: 'question',
        showCancelButton: true,
        confirmButtonColor: '#e6007e',
        cancelButtonColor: '#64748b',
        confirmButtonText: 'Ya, Approve',
        cancelButtonText: 'Batal'
      });

      if (!confirmResult.isConfirmed) return;

      const btn = document.getElementById(`approveBtn_${claimId}`);
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-[10px]"></i>`;
      }

      try {
        const response = await fetch(`/api/claims/${claimId}/approve`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ notes: 'Disetujui Admin VANCARE' })
        });

        const result = await response.json();

        if (response.ok && result.success) {
          Swal.fire({
            icon: 'success',
            title: 'Klaim Disetujui',
            text: `Tiket ${ticketNo} berhasil di-approve. Email notifikasi telah dikirimkan ke pelanggan.`,
            confirmButtonColor: '#e6007e'
          });
          await loadClaimsData();
        } else {
          Swal.fire({
            icon: 'error',
            title: 'Gagal',
            text: result.message || 'Terjadi kesalahan sistem'
          });
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = `<i class="fa-solid fa-check text-[10px]"></i> Approve`;
          }
        }
      } catch (err) {
        Swal.fire({ icon: 'error', title: 'Error', text: err.message });
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = `<i class="fa-solid fa-check text-[10px]"></i> Approve`;
        }
      }
    }

    /**
     * Buka modal rincian saat baris/tulisan di tabel diklik
     */
    function handleRowClick(e, claimId) {
      // Abaikan jika yang diklik adalah tombol tindakan atau link dokumen
      if (e.target.closest('button') || e.target.closest('a')) {
        return;
      }
      showDetail(claimId);
    }

    /**
     * Modal Detail
     */
    function showDetail(claimId) {
      const claim = allClaims.find(c => String(c.id) === String(claimId));
      if (!claim) return;

      const modal = document.getElementById('detailModal');
      const modalBody = document.getElementById('modalBody');

      modalBody.innerHTML = `
        <div class="grid grid-cols-2 gap-3 bg-slate-50 p-3.5 rounded-lg border border-slate-200">
          <div>
            <span class="text-slate-400 block text-[10px]">Nomor Tiket</span>
            <span class="font-bold text-slate-900">${claim.ticket_number}</span>
          </div>
          <div>
            <span class="text-slate-400 block text-[10px]">Status</span>
            <span class="font-semibold ${claim.status === 'APPROVED' ? 'text-emerald-600' : claim.status === 'PENDING' ? 'text-amber-600' : 'text-slate-600'}">${claim.status}</span>
          </div>
          <div>
            <span class="text-slate-400 block text-[10px]">Nama Pelanggan</span>
            <span class="font-medium text-slate-800">${escapeHtml(claim.customer_name)}</span>
          </div>
          <div>
            <span class="text-slate-400 block text-[10px]">WhatsApp / Telepon</span>
            <span class="font-medium text-slate-800">${claim.customer_phone}</span>
          </div>
          <div class="col-span-2">
            <span class="text-slate-400 block text-[10px]">Email</span>
            <span class="text-slate-700">${escapeHtml(claim.customer_email)}</span>
          </div>
          <div class="col-span-2">
            <span class="text-slate-400 block text-[10px]">Alamat</span>
            <span class="text-slate-700">${escapeHtml(claim.customer_address || '-')}</span>
          </div>
        </div>

        <div class="bg-slate-50 p-3.5 rounded-lg border border-slate-200 space-y-1.5">
          <div class="font-semibold text-slate-700 mb-1">Informasi Unit Advan</div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <span class="text-slate-400 block text-[10px]">Kategori & Tipe</span>
              <span class="font-medium text-slate-800">
                ${claim.product_category ? `<span class="text-brand-pink font-bold text-[10px] uppercase block">${escapeHtml(claim.product_category)}</span>` : ''}
                ${escapeHtml(claim.product_name)}
              </span>
            </div>
            <div>
              <span class="text-slate-400 block text-[10px]">Serial Number (SN)</span>
              <span class="font-mono text-slate-800">${escapeHtml(claim.serial_number)}</span>
            </div>
            <div>
              <span class="text-slate-400 block text-[10px]">Tanggal Beli</span>
              <span class="text-slate-700">${claim.purchase_date || '-'}</span>
            </div>
            <div>
              <span class="text-slate-400 block text-[10px]">Waktu Pengajuan</span>
              <span class="text-slate-700">${new Date(claim.created_at).toLocaleString('id-ID')}</span>
            </div>
          </div>
        </div>

        <div>
          <span class="text-slate-400 block text-[10px] mb-1 font-medium">Deskripsi Kerusakan</span>
          <div class="bg-slate-100 p-3 rounded-lg text-slate-700 whitespace-pre-wrap leading-relaxed border border-slate-200">
            ${escapeHtml(claim.issue_description)}
          </div>
        </div>

        ${(claim.photo_url || claim.drive_file_url || claim.video_url) ? `
          <div class="border border-slate-200 rounded-lg p-3 space-y-2 bg-slate-50">
            <span class="text-slate-500 font-semibold text-[10px] uppercase block">Lampiran Bukti Media</span>
            
            ${(claim.photo_url || claim.drive_file_url) ? `
              <div class="flex items-center justify-between border-b border-slate-200 pb-2">
                <div class="flex items-center gap-2">
                  <i class="fa-regular fa-image text-brand-pink text-base"></i>
                  <div>
                    <div class="font-medium text-slate-800">${escapeHtml(claim.photo_file_name || claim.drive_file_name || 'Foto Kendala / Nota')}</div>
                    <div class="text-[10px] text-slate-400">Foto bukti kondisi unit / nota pembelian</div>
                  </div>
                </div>
                <a href="${claim.photo_url || claim.drive_file_url}" target="_blank"
                  class="bg-slate-800 hover:bg-slate-900 text-white px-2.5 py-1 rounded text-[11px] font-medium transition inline-flex items-center gap-1">
                  <span>Buka Foto</span>
                  <i class="fa-solid fa-arrow-up-right-from-square text-[9px]"></i>
                </a>
              </div>
            ` : ''}

            ${claim.video_url ? `
              <div class="flex items-center justify-between pt-1">
                <div class="flex items-center gap-2">
                  <i class="fa-solid fa-film text-purple-600 text-base"></i>
                  <div>
                    <div class="font-medium text-slate-800">${escapeHtml(claim.video_file_name || 'Rekaman Video Kendala')}</div>
                    <div class="text-[10px] text-slate-400">Video dokumentasi kendala perangkat</div>
                  </div>
                </div>
                <a href="${claim.video_url}" target="_blank"
                  class="bg-purple-700 hover:bg-purple-800 text-white px-2.5 py-1 rounded text-[11px] font-medium transition inline-flex items-center gap-1">
                  <span>Putar Video</span>
                  <i class="fa-solid fa-arrow-up-right-from-square text-[9px]"></i>
                </a>
              </div>
            ` : ''}
          </div>
        ` : ''}

        ${claim.status === 'REJECTED' ? `
          <div class="bg-rose-50 border border-rose-200 rounded-lg p-3 text-rose-800">
            <span class="text-[10px] font-bold uppercase block text-rose-600">Alasan Penolakan:</span>
            <p class="mt-0.5 text-xs font-medium">${escapeHtml(claim.rejected_reason || 'Tidak memenuhi syarat & ketentuan garansi resmi.')}</p>
          </div>
        ` : ''}

        ${claim.status === 'PENDING' ? `
          <div class="pt-2 flex items-center gap-2">
            <button onclick="closeDetailModal(); oneClickApprove('${claim.id}', '${claim.ticket_number}', '${escapeHtml(claim.customer_name)}')"
              class="flex-1 bg-brand-pink hover:bg-brand-pink-hover text-white font-semibold py-2 px-4 rounded-lg transition flex items-center justify-center gap-1.5 shadow-sm">
              <i class="fa-solid fa-check"></i>
              <span>Approve Klaim Ini</span>
            </button>
            <button onclick="closeDetailModal(); rejectClaimModal('${claim.id}', '${claim.ticket_number}', '${escapeHtml(claim.customer_name)}')"
              class="bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 font-semibold py-2 px-4 rounded-lg transition flex items-center justify-center gap-1.5">
              <i class="fa-solid fa-xmark"></i>
              <span>Tolak Klaim</span>
            </button>
          </div>
        ` : ''}
      `;

      modal.classList.remove('hidden');
    }

    function closeDetailModal() {
      document.getElementById('detailModal').classList.add('hidden');
    }

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text);
      Swal.fire({
        toast: true,
        position: 'top-end',
        icon: 'success',
        title: `Disalin: ${text}`,
        showConfirmButton: false,
        timer: 1500
      });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
